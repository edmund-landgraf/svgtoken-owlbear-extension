<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SVG Token Owlbear</title>
  <desc id="desc">A round tabletop token icon with overlapping SVG letters.</desc>
  <defs>
    <radialGradient id="tokenFill" cx="34%" cy="26%" r="76%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="42%" stop-color="#f59e0b" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="rim" x1="88" x2="424" y1="88" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1f2937"/>
  <circle cx="256" cy="256" r="214" fill="url(#tokenFill)" stroke="url(#rim)" stroke-width="28" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" paint-order="stroke fill">
    <text x="204" y="290" text-anchor="middle" dominant-baseline="middle" font-size="240" fill="#ffffff" stroke="#1f160f" stroke-width="14">S</text>
    <text x="326" y="230" text-anchor="middle" dominant-baseline="middle" font-size="112" fill="#ffffff" stroke="#1f160f" stroke-width="9">V</text>
    <text x="330" y="326" text-anchor="middle" dominant-baseline="middle" font-size="118" fill="#ffffff" stroke="#1f160f" stroke-width="9">G</text>
  </g>
</svg>
